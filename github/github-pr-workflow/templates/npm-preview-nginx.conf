# Nginx Proxy Manager — Preview Host Config
# For PR preview deployments using NPM as reverse proxy.
# Copy to /data/nginx/proxy_host/${PR_NUMBER}.conf inside the NPM container.
#
# Usage:
#   envsubst '${PR_NUMBER}' < this-template > /tmp/preview-${PR_NUMBER}.conf
#   docker cp /tmp/preview-${PR_NUMBER}.conf nginx_proxy_manager:/data/nginx/proxy_host/${PR_NUMBER}.conf
#   docker exec nginx_proxy_manager nginx -s reload
#
# Architecture:
#   Frontend (SPA) on taskflow-frontend-${PR_NUMBER}:5173
#   Backend API on taskflow-backend-${PR_NUMBER}:8000
#
# Variables to substitute:
#   ${PR_NUMBER} — the GitHub PR number

server {
  listen 80;
  listen [::]:80;

  server_name ${PR_NUMBER}.praxis.129.146.163.107.sslip.io;

  # ── Backend routes ───────────────────────────────────────
  location /api/ {
    proxy_pass http://taskflow-backend-${PR_NUMBER}:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://taskflow-backend-${PR_NUMBER}:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /auth/ {
    proxy_pass http://taskflow-backend-${PR_NUMBER}:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ── SPA frontend ─────────────────────────────────────────
  location / {
    include conf.d/include/proxy.conf;
  }
}
