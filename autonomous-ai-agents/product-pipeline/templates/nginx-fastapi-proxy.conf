# NGINX config for FastAPI + Vite frontend
# Usage: replace <backend-service> with actual service hostname
#
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location /api/ {
        proxy_pass http://<backend-service>:8000;
        # CRITICAL: use $http_host (includes port), NOT $host
        # $host strips the port, causing FastAPI 307 redirects
        # to point at port 80 instead of the actual port
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
