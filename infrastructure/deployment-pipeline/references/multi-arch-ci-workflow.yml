# Complete CI/CD workflow with multi-arch builds and GHCR_TOKEN deploy
# Drop this into .github/workflows/ci.yml and adjust:
#   - IMAGE_BACKEND / IMAGE_FRONTEND to your image paths
#   - Host IP, SSH key, GHCR_TOKEN secret names
#   - Test commands if different

name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/<owner>/<repo>/backend
  IMAGE_FRONTEND: ghcr.io/<owner>/<repo>/frontend

permissions:
  contents: read
  packages: write

jobs:
  ##########################################################################
  # TESTS — run on every push/PR, gate for build
  ##########################################################################
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
        working-directory: ./backend
      - run: pytest ../tests/ -v --timeout=60
        working-directory: ./backend

  ##########################################################################
  # BUILD & PUSH — only on push to master, after tests pass
  ##########################################################################
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # REQUIRED for building arm64 from amd64 runner
      - name: Set up QEMU for multi-arch
        uses: docker/setup-qemu-action@v3

      - name: Generate short SHA
        id: sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_BACKEND }}:sha-${{ steps.sha.outputs.sha }}
            ${{ env.IMAGE_BACKEND }}:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_FRONTEND }}:sha-${{ steps.sha.outputs.sha }}
            ${{ env.IMAGE_FRONTEND }}:latest

  ##########################################################################
  # DEPLOY — SSH to server, login to ghcr.io, pull images, restart stack
  ##########################################################################
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build-and-push]
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: <server-ip>
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/selfhost/<app>
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            echo "[deploy] Pulling new images..."
            docker compose pull
            echo "[deploy] Recreating containers..."
            docker compose up -d --remove-orphans
            echo "[deploy] Pruning old images..."
            docker image prune -f --filter "until=24h" 2>/dev/null || true
            echo "[deploy] Done."
