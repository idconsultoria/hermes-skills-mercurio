# SearXNG — overrides for Firecrawl integration
# use_default_settings.engines.keep_only reduz o SearXNG às engines
# validadas empiricamente (2026-08-15, 2 rodadas x 5 queries, IP Oracle).
#
# IMPORTANTE: no settings.yml default do SearXNG, todas as 5 engines estão
# com `disabled: true` — o keep_only mantém esse estado. Por isso cada uma
# precisa de `disabled: false` explícito no bloco engines.

use_default_settings:
  engines:
    keep_only:
      - bing
      - gmx
      - seznam
      - mwmbl
      - boardreader

general:
  instance_name: "SearXNG (Firecrawl)"
  enable_metrics: false

search:
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: true

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
  enable_http2: true

engines:
  - name: bing
    disabled: false
    weight: 2.0
  - name: gmx
    disabled: false
    weight: 1.5
  - name: seznam
    disabled: false
    weight: 1.5
  - name: mwmbl
    disabled: false
    weight: 1.0
  - name: boardreader
    disabled: false
    weight: 1.0
