<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IAF — Manhã Aumentada (Light)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f4f7f9;
      --accent-primary: #0a8f88;
      --accent-hover: #06b8a0;
      --accent-muted: rgba(10, 143, 136, 0.08);
      --accent-terracotta: #c75b3e;
      --accent-sage: #5f7a6b;
      --accent-amber: #b8860b;
      --text-primary: #1a1f24;
      --text-secondary: #5a6b72;
      --border-color: rgba(10, 143, 136, 0.18);
      --border-radius-lg: 14px;
      --border-radius-sm: 6px;
      --font-title: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-code: 'Fira Code', monospace;
      --shadow-card: 0 2px 12px rgba(0,0,0,0.05);
    }
    @page { size: A4; margin: 0; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      background-color: #e8edf0;
      color: var(--text-primary);
      line-height: 1.6;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      width: 100%; max-width: 800px;
      background-color: var(--bg-primary);
      border: 1px solid #d0d8dc;
      border-radius: 20px;
      padding: 50px 45px;
      position: relative; overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    .bg-grid {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        linear-gradient(rgba(10,143,136,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(10,143,136,0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      pointer-events: none; z-index: 1;
    }
    .ambient-glow {
      position: absolute; width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(10,143,136,0.04) 0%, transparent 70%);
      top: -100px; right: -100px;
      pointer-events: none; z-index: 1;
    }
    .content { position: relative; z-index: 2; }

    .header {
      display: flex; justify-content: space-between; align-items: flex-end;
      padding-bottom: 24px; margin-bottom: 36px;
      border-bottom: 1px solid rgba(10,143,136,0.2);
    }
    .header-left { display: flex; flex-direction: column; align-items: flex-start; }
    .header-separator { width: 1px; height: 35px; background: rgba(10,143,136,0.25); }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .iaf-logo-container { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; line-height: 1.0; }
    .iaf-logo-acronym { font-family: var(--font-title); font-size: 18px; font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text-primary); margin-bottom: 2px; }
    .iaf-logo-tagline { font-family: var(--font-code); font-size: 7px; font-weight: 700; color: var(--accent-primary); text-transform: uppercase; letter-spacing: 1.8px; white-space: nowrap; }
    .newsletter-title { font-family: var(--font-title); font-weight: 900; font-size: 28px; text-transform: uppercase; letter-spacing: -0.5px; line-height: 1.1; margin: 0; padding: 0; }
    .newsletter-title span {
      background: linear-gradient(90deg, var(--text-primary) 30%, var(--accent-hover) 100%);
      background-clip: text; -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .newsletter-subtitle { font-family: var(--font-body); font-size: 11px; color: var(--text-secondary); margin-top: 3px; }
    .header-metadata-box { font-family: var(--font-code); font-size: 10px; color: var(--text-secondary); display: flex; flex-direction: column; gap: 4px; text-align: right; align-items: flex-end; }
    .meta-row { display: flex; gap: 6px; }
    .meta-label { color: var(--text-secondary); }
    .meta-value { color: var(--accent-primary); font-weight: 700; }

    .section { margin-bottom: 36px; }
    .section-title {
      font-family: var(--font-title); font-weight: 700; font-size: 16px;
      color: var(--accent-primary); margin-bottom: 16px;
      display: flex; align-items: center; gap: 10px;
      text-transform: uppercase; letter-spacing: 1px;
    }
    .section-title span { background-color: var(--bg-primary); padding-right: 8px; z-index: 2; display: inline-flex; align-items: center; gap: 8px; }
    .title-icon { width: 16px; height: 16px; color: var(--accent-hover); stroke-width: 2.2; flex-shrink: 0; }
    .section-title .line { flex-grow: 1; height: 1px; background: linear-gradient(90deg, rgba(10,143,136,0.3), transparent); }

    .hot-take-box {
      background: linear-gradient(135deg, rgba(10,143,136,0.04) 0%, rgba(244,247,249,0.6) 100%);
      border: 1px solid rgba(10,143,136,0.2);
      border-left: 3px solid var(--accent-hover);
      border-radius: 0 var(--border-radius-lg) var(--border-radius-lg) 0;
      padding: 20px 24px;
    }
    .hot-take-text { font-size: 13px; line-height: 1.7; color: #2d363d; }
    .hot-take-text strong { color: var(--accent-hover); font-weight: 600; }

    .deep-dive-card { background-color: var(--bg-secondary); border: 1px solid #d8e0e4; border-radius: var(--border-radius-lg); padding: 20px; box-shadow: var(--shadow-card); margin-bottom: 16px; }
    .deep-dive-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .deep-dive-title { font-family: var(--font-title); font-weight: 700; font-size: 15px; color: var(--text-primary); }
    .dd-tag { font-family: var(--font-code); font-size: 8.5px; font-weight: 700; padding: 2px 8px; border-radius: var(--border-radius-sm); text-transform: uppercase; }
    .dd-tag.tag-analysis { color: var(--accent-terracotta); background: rgba(199,91,62,0.06); border: 1px solid rgba(199,91,62,0.15); }
    .dd-tag.tag-product { color: var(--accent-sage); background: rgba(95,122,107,0.06); border: 1px solid rgba(95,122,107,0.15); }
    .deep-dive-body { font-size: 12.5px; color: #3a454d; line-height: 1.65; margin-bottom: 14px; }
    .deep-dive-body strong { color: var(--accent-hover); font-weight: 600; }
    .deep-dive-link { display: inline-flex; align-items: center; font-family: var(--font-code); font-size: 10.5px; font-weight: 500; color: var(--accent-primary); text-decoration: none; border-bottom: 1px dashed rgba(10,143,136,0.2); }

    .news-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 9px 12px; margin-bottom: 8px;
      background-color: #f4f7f9;
      border: 1px solid #dde3e7;
      border-radius: var(--border-radius-sm);
    }
    .news-bullet { color: var(--accent-hover); font-family: var(--font-code); font-weight: 700; font-size: 13px; flex-shrink: 0; }
    .news-text { font-size: 12px; color: #3a454d; }
    .news-text strong { color: var(--text-primary); font-weight: 600; }
    .news-text a { color: var(--accent-primary); text-decoration: none; border-bottom: 1px dashed rgba(10,143,136,0.15); }
    .news-tag {
      font-family: var(--font-code); font-size: 8px; font-weight: 700;
      color: var(--accent-primary); background-color: var(--accent-muted);
      border: 1px solid rgba(10,143,136,0.12);
      padding: 1px 5px; border-radius: 4px; margin-left: 4px;
      text-transform: uppercase; display: inline-block; vertical-align: middle;
    }
    .news-tag.tag-biz { color: var(--accent-terracotta); background: rgba(199,91,62,0.06); border-color: rgba(199,91,62,0.15); }

    .app-card { background: #f4f7f9; border: 1px solid #d8e0e4; border-radius: var(--border-radius-lg); padding: 22px 24px; border-left: 3px solid var(--accent-sage); box-shadow: var(--shadow-card); }
    .app-source { font-family: var(--font-code); font-size: 9.5px; font-weight: 700; color: var(--accent-hover); text-transform: uppercase; }
    .app-title { font-family: var(--font-title); font-weight: 600; font-size: 15px; color: var(--text-primary); }
    .app-desc { font-size: 12.5px; color: #3a454d; line-height: 1.7; }
    .app-desc strong { color: var(--accent-primary); font-weight: 700; }
    .app-desc code { font-family: var(--font-code); font-size: 10.5px; background-color: #e8edf0; color: var(--accent-hover); padding: 1px 4px; border-radius: 4px; }
    .app-benefit { margin-top: 12px; padding: 10px 14px; background: rgba(10,143,136,0.04); border-left: 3px solid var(--accent-hover); border-radius: 0 6px 6px 0; font-size: 12px; color: #2d363d; }
    .app-benefit strong { color: var(--accent-hover); }

    .community-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 9px 12px; margin-bottom: 8px;
      background-color: #f4f7f9; border: 1px solid #dde3e7;
      border-radius: var(--border-radius-sm); font-size: 12px;
    }
    .community-item strong { color: var(--text-primary); }
    .community-item a { color: var(--accent-primary); text-decoration: none; border-bottom: 1px dashed rgba(10,143,136,0.15); }
    .community-sentiment {
      font-family: var(--font-code); font-size: 9px; font-weight: 700;
      padding: 2px 7px; border-radius: 4px;
      text-transform: uppercase; flex-shrink: 0;
    }
    .sentiment-hot { background: rgba(199,91,62,0.06); color: var(--accent-terracotta); border: 1px solid rgba(199,91,62,0.15); }
    .sentiment-mixed { background: rgba(95,122,107,0.06); color: var(--accent-sage); border: 1px solid rgba(95,122,107,0.15); }

    .footer { margin-top: 45px; padding-top: 18px; border-top: 1px solid rgba(10,143,136,0.2); display: flex; justify-content: space-between; align-items: center; font-family: var(--font-code); font-size: 8.5px; color: #7a8a92; }
    .footer-left { font-weight: 700; text-transform: uppercase; }
    .footer-center { max-width: 420px; text-align: center; line-height: 1.4; color: #7a8a92; }
    .footer-right a { color: var(--accent-primary); text-decoration: none; }
  </style>
</head>
<body>
<div class="page">
  <div class="bg-grid"></div>
  <div class="ambient-glow"></div>
  <div class="content">
    <!-- Header, sections, footer go here — uses light CSS variables above -->
  </div>
</div>
</body>
</html>
