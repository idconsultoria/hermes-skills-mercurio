<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hermes Skills Graph</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #0a0a14;
  color: #e0e0e0;
  overflow: hidden;
  height: 100dvh;
  width: 100vw;
  touch-action: none;
}
#graph { width: 100%; height: 100%; }
#controls {
  position: fixed; top: 12px; left: 12px; z-index: 10;
  display: flex; flex-direction: column; gap: 6px; max-width: 220px;
}
input, button {
  background: #1a1a2e; color: #c0c0e0; border: 1px solid #303050;
  border-radius: 6px; padding: 8px 12px; font-size: 13px; font-family: inherit;
}
input::placeholder { color: #505070; }
button { cursor: pointer; }
button:hover { background: #252540; }
#legend {
  position: fixed; bottom: 12px; left: 12px; z-index: 10;
  font-size: 11px; background: #1a1a2ee0; padding: 10px 14px;
  border-radius: 8px; border: 1px solid #303050;
  display: flex; flex-wrap: wrap; gap: 10px; max-width: calc(100vw - 24px);
}
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-dashed { border-top: 2px dashed #8080a0; width: 18px; }
.legend-solid { background: #6080ff; width: 18px; height: 2px; }
#stats {
  position: fixed; top: 12px; right: 12px; z-index: 10;
  font-size: 11px; color: #606080; text-align: right;
}

/* Modal */
#modal-backdrop {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(0,0,0,0.6);
  display: none; align-items: center; justify-content: center;
}
#modal-backdrop.open { display: flex; }
#modal {
  background: #141428; border: 1px solid #303058; border-radius: 14px;
  padding: 0; max-width: 560px; width: 92vw; max-height: 85dvh;
  overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  animation: modalIn 0.2s ease-out;
}
@keyframes modalIn { from { opacity: 0; transform: translateY(16px) scale(0.97); } }
#modal-header {
  padding: 20px 24px 16px; border-bottom: 1px solid #202038;
  position: sticky; top: 0; background: #141428; z-index: 1;
}
#modal-close {
  float: right; background: none; border: none; color: #606090;
  font-size: 22px; cursor: pointer; line-height: 1; padding: 0 0 4px 8px;
}
#modal-close:hover { color: #fff; }
.modal-category {
  display: inline-block; padding: 2px 10px; border-radius: 10px;
  font-size: 10px; font-weight: 600; letter-spacing: 0.5px;
  margin-right: 8px; vertical-align: middle;
}
.modal-title { font-size: 17px; font-weight: 700; color: #fff; margin: 8px 0 0; }
#modal-body { padding: 20px 24px 24px; }
.modal-section { margin-bottom: 18px; }
.modal-section-title {
  font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
  color: #505080; margin-bottom: 8px; font-weight: 600;
}
.modal-summary {
  font-size: 13px; color: #b0b0d0; line-height: 1.6;
  padding: 10px 14px; background: #1a1a32; border-radius: 8px;
  border-left: 3px solid #404080;
}
.modal-desc {
  font-size: 13px; color: #9090b0; line-height: 1.7; white-space: pre-wrap;
}
.modal-meta { font-size: 11px; color: #505070; display: flex; gap: 16px; flex-wrap: wrap; }
.modal-meta span { white-space: nowrap; }
.modal-relations { display: flex; flex-direction: column; gap: 5px; }
.modal-rel {
  font-size: 11px; padding: 4px 10px; border-radius: 5px;
  background: #1a1a30; display: inline-flex; align-items: center; gap: 6px;
  width: fit-content;
}
.modal-rel-type {
  font-weight: 600; font-size: 9px; text-transform: uppercase;
  letter-spacing: 0.5px; padding: 1px 6px; border-radius: 4px;
}
.rel-similar { background: #2a2a40; color: #8080a0; }
.rel-uses { background: #1a2a40; color: #6080ff; }
.rel-parent { background: #2a1a30; color: #b060e0; }
.rel-used_by { background: #1a3020; color: #50b070; }

@media (max-width: 480px) {
  #controls { top: 8px; left: 8px; gap: 4px; max-width: 160px; }
  input, button { padding: 6px 10px; font-size: 12px; }
  #legend { padding: 6px 10px; gap: 6px; font-size: 10px; }
  #modal { max-width: 100vw; border-radius: 12px 12px 0 0; max-height: 90dvh; }
  #modal-header { padding: 16px 18px 12px; }
  #modal-body { padding: 16px 18px 20px; }
  .modal-title { font-size: 15px; }
}
</style>
</head>
<body>
<div id="graph"></div>
<div id="controls">
  <input type="text" id="search" placeholder="Filter skills..." oninput="filterNodes()">

</div>
<div id="stats"></div>
<div id="legend">
  <div class="legend-item"><div class="legend-solid"></div><span>uses / used by</span></div>
  <div class="legend-item"><div class="legend-dashed"></div><span>similar</span></div>
</div>
<div id="modal-backdrop" onclick="closeModal(event)">
  <div id="modal" onclick="event.stopPropagation()">
    <div id="modal-header">
      <button id="modal-close" onclick="closeModal()">&times;</button>
      <div>
        <span class="modal-category" id="modal-cat-badge"></span>
        <span style="font-size:10px;color:#505070" id="modal-size"></span>
      </div>
      <div class="modal-title" id="modal-title"></div>
    </div>
    <div id="modal-body">
      <div class="modal-section" id="modal-summary-section">
        <div class="modal-section-title">Summary</div>
        <div class="modal-summary" id="modal-summary"></div>
      </div>
      <div class="modal-section" id="modal-desc-section">
        <div class="modal-section-title">Description</div>
        <div class="modal-desc" id="modal-desc"></div>
      </div>
      <div class="modal-section">
        <div class="modal-section-title">Relations</div>
        <div class="modal-relations" id="modal-relations"></div>
      </div>
    </div>
  </div>
</div>

<script>
const DATA = {"nodes": [{"id": "dogfood", "label": "dogfood", "title": "Dogfood: Systematic Web Application QA Testing", "size": 9581, "category": "uncategorized", "summary": "Exploratory QA of web applications — find bugs, gather evidence, and write reports", "description": "Exploratory QA of web applications — find bugs, gather evidence, and write reports.\\n\\nLoad this skill for manual or automated quality assurance of web apps. Covers systematic exploratory testing workflows, bug discovery techniques, capturing screenshots and logs as evidence, documenting reproducible steps, and producing structured QA reports with severity ratings."}, {"id": "autonomous-ai-agents/pi-session-audit", "label": "pi-session-audit", "title": "Pi Agent Session Audit", "size": 11874, "category": "autonomous-ai-agents", "summary": "Audita sessões do Pi Agent extraindo duração, tokens, custo e modelo dos arquivos", "description": "Audita sessões do Pi Agent extraindo duração, tokens, custo e modelo dos arquivos .jsonl.\\n\\nLoad this skill to analyze Pi Agent session logs and calculate costs per provider. Extracts real usage metrics from session JSONL files, computes costs based on model pricing, and produces audit reports for tracking agent usage and spending."}, {"id": "autonomous-ai-agents/autonomous-ai-agents", "label": "autonomous-ai-agents", "title": "Autonomous AI Coding Agents", "size": 3348, "category": "autonomous-ai-agents", "summary": "Delegate tasks to autonomous AI coding agent CLIs via Hermes — one-shot, PR review, and...", "description": "Delegate tasks to autonomous AI coding agent CLIs via Hermes — one-shot, PR review, and session orchestration.\\n\\nLoad this skill when you need to delegate coding tasks to external AI coding agents (Claude Code, Codex, OpenCode, etc.). Covers one-shot delegation patterns, PR review workflows, session orchestration, and choosing the right agent for the task."}, {"id": "autonomous-ai-agents/product-pipeline", "label": "product-pipeline", "title": "Product Development Pipeline", "size": 80345, "category": "autonomous-ai-agents", "summary": "Multi-agent product pipeline from raw idea to MVP with iterative sprints — orchestrated...", "description": "Multi-agent product pipeline from raw idea to MVP with iterative sprints — orchestrated by Hermes, executed by Pi Agent + Antigravity.\\n\\nLoad this skill when building a product from scratch through the full pipeline — ideation, research, design, sprints, and delivery. Covers orchestrating a multi-agent team with Hermes as coordinator, Pi Agent for execution, and Antigravity for visual design review."}, {"id": "autonomous-ai-agents/pi-agent-coordination", "label": "pi-agent-coordination", "title": "Pi Agent (Local)", "size": 26827, "category": "autonomous-ai-agents", "summary": "Invoke Pi Agent locally from Hermes with provider/model hierarchy, session recovery, an...", "description": "Invoke Pi Agent locally from Hermes with provider/model hierarchy, session recovery, and stall detection.\\n\\nLoad this skill for running Pi Coder Agent (v0.78.1) as a local npm binary — no Docker, no SSH. Covers the three-tier hierarchy (agy for strategy, Pi best via MiniMax M3 for planning, Pi cost via DeepSeek V4 Flash for code tasks), provider/model selection with fallback chains, session recovery from interrupted runs, stall detection and diagnosis, parallel execution patterns, and tmux-based monitoring. Includes GoUsageLimitError handling and pre-launch session reuse checks."}, {"id": "autonomous-ai-agents/hermes-agent", "label": "hermes-agent", "title": "Hermes Agent", "size": 47006, "category": "autonomous-ai-agents", "summary": "Configure, extend, or contribute to Hermes Agent — setup, profiles, skills, and multi-a...", "description": "Configure, extend, or contribute to Hermes Agent — setup, profiles, skills, and multi-agent orchestration.\\n\\nLoad this skill when working with Hermes Agent itself. Covers initial setup and configuration, managing profiles, creating and installing skills, multi-agent spawning patterns, CLI usage, gateway configuration, and contributing to the Hermes codebase."}, {"id": "autonomous-ai-agents/messaging-platforms", "label": "messaging-platforms", "title": "Messaging Platforms", "size": 15243, "category": "autonomous-ai-agents", "summary": "Reference for Hermes cross-platform messaging — platform quirks, ID formats, and bridge...", "description": "Reference for Hermes cross-platform messaging — platform quirks, ID formats, and bridge workarounds.\\n\\nLoad this skill when troubleshooting message delivery across platforms. Covers Telegram MEDIA file delivery rules, WhatsApp JID/group ID formats, bridge processes for WhatsApp and Telegram, known file-type limitations, and platform-specific workarounds for reliable cross-platform messaging."}, {"id": "software-development/skills-repo-curator", "label": "skills-repo-curator", "title": "Skills Repository Curator", "size": 17188, "category": "software-development", "summary": "Gerencia o skills repo em /opt/data/skills/ com controle de versão Git: Ciclo de Consol...", "description": "Gerencia o skills repo em /opt/data/skills/ com controle de versão Git: Ciclo de Consolidação (Update→Evolve→Offload), análise MECE, merges, revisão de órfãos, inferência depth-1 de relações, auditoria de conformidade de descrições, index.md/log.md/reports, geração de grafo D3 interativo e offload de memória.\\n\\nLoad this skill when the skills repo needs maintenance — evolve cycles, description audits, relation rebuilding, orphan review, AGENTS.md updates, or any skills repository management task. Executes the full consolidation lifecycle: analyze portfolio, propose merges, delete redundant skills, review orphans, write reports, offload learned facts to skills, generate graph, and commit."}, {"id": "software-development/hermes-agent-skill-authoring", "label": "hermes-agent-skill-authoring", "title": "Authoring Hermes-Agent Skills (in-repo)", "size": 12053, "category": "software-development", "summary": "Author in-repo SKILL", "description": "Author in-repo SKILL.md and DESIGN.md token specs — frontmatter, validator, structure.\\n\\nLoad this skill when creating or editing skills that ship with the Hermes Agent repository. Covers SKILL.md frontmatter requirements, DESIGN.md token specifications, frontmatter validation, directory structure conventions, and workflow for committing in-repo skills. Does NOT cover user-local skills (use skill_manage for those)."}, {"id": "software-development/agy", "label": "agy", "title": "agy — Antigravity CLI (Consultor Externo)", "size": 8611, "category": "software-development", "summary": "Google Antigravity CLI (agy) — installation, OAuth auth, and design workflows for HTML ...", "description": "Google Antigravity CLI (agy) — installation, OAuth auth, and design workflows for HTML reports and prototyping.\\n\\nLoad this skill for strategic design tasks — visual HTML output, brand presentations, UI mockups, SVGs, and prototypes. Covers agy installation, OAuth authentication via tmux, and design workflows including image generation, prototyping, parallel subagents, and HTML report generation. Part of the three-tier agent hierarchy (agy > Pi best > Pi cost) where agy serves as external specialist consultant."}, {"id": "software-development/test-driven-development", "label": "test-driven-development", "title": "Test-Driven Development (TDD)", "size": 10102, "category": "software-development", "summary": "TDD: enforce RED-GREEN-REFACTOR, tests before code — write the test first, then the imp...", "description": "TDD: enforce RED-GREEN-REFACTOR, tests before code — write the test first, then the implementation.\\n\\nLoad this skill when practicing Test-Driven Development. Covers the RED-GREEN-REFACTOR cycle, writing tests before implementation, triangulation patterns, keeping tests small and focused, and integrating TDD into the development workflow."}, {"id": "software-development/systematic-debugging", "label": "systematic-debugging", "title": "Systematic Debugging", "size": 12661, "category": "software-development", "summary": "4-phase root cause debugging methodology with Python (pdb/debugpy) and Node", "description": "4-phase root cause debugging methodology with Python (pdb/debugpy) and Node.js (--inspect) tooling.\\n\\nLoad this skill when you need to systematically find root causes before fixing bugs. Covers the four-phase debugging methodology — reproduce, isolate, identify root cause, verify fix — with language-specific tooling for Python (pdb, debugpy) and Node.js (--inspect, Chrome DevTools). Includes concrete debugging patterns and emphasizes understanding bugs before attempting fixes."}, {"id": "software-development/backlog-and-sprint", "label": "backlog-and-sprint", "title": "Backlog & Sprint", "size": 79684, "category": "software-development", "summary": "Backlog management and Sprint execution for product iteration (Fase 5)", "description": "Backlog management and Sprint execution for product iteration (Fase 5). Mantém uma backlog não-estruturada de pedidos de melhoria, e orquestra Sprints completas (PM → UX/UI → Engineering → Review → Close).\\n\\nLoad this skill during the execution phase (Fase 5) of the product pipeline. Covers maintaining an unstructured backlog of improvement requests and orchestrating complete Sprints — from PM and UX/UI through Engineering, Review, and Close."}, {"id": "software-development/ideation-drilling", "label": "ideation-drilling", "title": "Ideation Drilling (Hermes — Orchestrator)", "size": 14708, "category": "software-development", "summary": "Orquestra a Fase 1 (Ideação) do pipeline de produto", "description": "Orquestra a Fase 1 (Ideação) do pipeline de produto. Invoca o Pi Agent para fazer perguntas profundas, refinar clareza, e produzir um Ideation Result.\\n\\nLoad this skill at the start of the product pipeline (Fase 1). Covers invoking Pi Agent with the ideation-drilling skill loaded to conduct deep questioning about the idea, refine clarity, and produce an Ideation Result document. Detects the <!-- PHASE_COMPLETE: ideation --> marker to advance to the next phase."}, {"id": "software-development/plan", "label": "plan", "title": "Plan Mode", "size": 11315, "category": "software-development", "summary": "Plan mode: write an actionable markdown plan to", "description": "Plan mode: write an actionable markdown plan to .hermes/plans/, no execution. Bite-sized tasks, exact paths, complete code."}, {"id": "software-development/skill-curation", "label": "skill-curation", "title": "Skill Curation — Discover, Evaluate & Install Hermes Skills", "size": 10863, "category": "software-development", "summary": "Discover, evaluate, rank, and install community skills for Hermes Agent — full curation...", "description": "Discover, evaluate, rank, and install community skills for Hermes Agent — full curation lifecycle from search to verification.\\n\\nLoad this skill when you need to find, evaluate, and install community skills for Hermes. Covers web search for skills, extraction from GitHub repos, cross-referencing reviews, tiered ranking with user feedback, installation via tap+hub or raw URL, and post-install verification. Does NOT cover authoring SKILL.md files (see hermes-agent-skill-authoring)."}, {"id": "software-development/spike", "label": "spike", "title": "Spike", "size": 9034, "category": "software-development", "summary": "Throwaway experiments to validate an idea before building it", "description": "Throwaway experiments to validate an idea before building it.\\n\\nLoad this skill when you need to quickly prototype or validate a concept before committing to full implementation. Covers creating isolated throwaway experiments, defining success criteria, running fast validation cycles, and documenting findings to inform build decisions."}, {"id": "productivity/html-to-pdf-chromium", "label": "html-to-pdf-chromium", "title": "HTML → PDF com Chromium Headless", "size": 6185, "category": "productivity", "summary": "Convert HTML to high-fidelity PDF using Chromium headless without root or Playwright", "description": "Convert HTML to high-fidelity PDF using Chromium headless without root or Playwright.\\n\\nLoad this skill when weasyprint or other tools lose CSS features like gradients, webkit-background-clip, grid, or glow effects. Uses Chromium headless extracted from Debian .deb packages for browser-quality PDF rendering without root access, Playwright, or Puppeteer. Covers setup, rendering options, and CSS feature preservation for complex layouts."}, {"id": "productivity/nano-pdf", "label": "nano-pdf", "title": "nano-pdf", "size": 1737, "category": "productivity", "summary": "Edit PDF text, typos, and titles via the nano-pdf CLI using natural language prompts", "description": "Edit PDF text, typos, and titles via the nano-pdf CLI using natural language prompts.\\n\\nLoad this skill when you need to make quick edits to PDF files — fixing typos, updating titles or metadata, or modifying text content — using natural language commands through the nano-pdf CLI tool without manual PDF editing."}, {"id": "productivity/relatorio-de-custos", "label": "relatorio-de-custos", "title": "Relatório de Custos — Skill de Geração", "size": 9863, "category": "productivity", "summary": "Gera relatórios técnicos de custos de execução de projetos multi-agente com dados reais...", "description": "Gera relatórios técnicos de custos de execução de projetos multi-agente com dados reais de tokens.\\n\\nLoad this skill when the user asks for cost reports, spending breakdowns, or project expense analysis. Extracts real data from Hermes (state.db) and Pi Agent (.jsonl) session logs, calculates costs based on model pricing per provider, and produces styled HTML reports via Antigravity (agy) with Hermes Style Guide design."}, {"id": "productivity/airtable", "label": "airtable", "title": "Airtable — Bases, Tables & Records", "size": 11627, "category": "productivity", "summary": "Airtable REST API via curl — records CRUD, filters, and upserts", "description": "Airtable REST API via curl — records CRUD, filters, and upserts.\\n\\nLoad this skill when you need to interact with Airtable bases programmatically. Covers creating, reading, updating, and deleting records, applying filters and sorting, performing upserts, and managing table schemas through the Airtable REST API using curl commands."}, {"id": "productivity/powerpoint", "label": "powerpoint", "title": "Powerpoint Skill", "size": 9626, "category": "productivity", "summary": "Create, read, and edit PowerPoint", "description": "Create, read, and edit PowerPoint .pptx decks — slides, notes, and templates.\\n\\nLoad this skill when you need to work with PowerPoint files programmatically. Covers creating new presentations from templates, adding and editing slides, modifying speaker notes, updating text content, and handling slide layouts and masters."}, {"id": "productivity/html-report-hermes", "label": "html-report-hermes", "title": "HTML Report — Hermes Design System", "size": 15177, "category": "productivity", "summary": "Render research reports as dark-themed HTML with SVG charts and Tufte-inspired typography", "description": "Render research reports as dark-themed HTML with SVG charts and Tufte-inspired typography.\\n\\nLoad this skill when the user needs structured visual output — data reports, benchmarks, dashboards, or landing pages. Activates automatically for visual requests. Two design systems: Hermes CRT (amber/blue inversion, scanlines, terminal aesthetic) for visual showcases, and Hermes Official (blue royal on white, Inter + Space Mono) for data reports. Covers CRT overlay mechanics, component library, report templates, Telegram delivery via ZIP, and agy pipeline for complex CRT pages."}, {"id": "productivity/notion", "label": "notion", "title": "Notion", "size": 15684, "category": "productivity", "summary": "Notion API plus ntn CLI — pages, databases, markdown import, and Cloudflare Workers int...", "description": "Notion API plus ntn CLI — pages, databases, markdown import, and Cloudflare Workers integration.\\n\\nLoad this skill when you need to interact with Notion programmatically. Covers creating and updating pages, querying databases, importing and exporting markdown content, and deploying Notion-integrated Cloudflare Workers for automation."}, {"id": "productivity/ocr-and-documents", "label": "ocr-and-documents", "title": "PDF & Document Extraction", "size": 5583, "category": "productivity", "summary": "Extract text from PDFs and scanned documents using pymupdf and marker-pdf", "description": "Extract text from PDFs and scanned documents using pymupdf and marker-pdf.\\n\\nLoad this skill when you need to extract text content from PDF files or scanned documents. Covers using pymupdf for direct text extraction, marker-pdf for OCR-based extraction from scans, handling multi-page documents, and preserving layout structure where possible."}, {"id": "productivity/google-workspace", "label": "google-workspace", "title": "Google Workspace", "size": 16611, "category": "productivity", "summary": "Google OAuth2 client credentials (downloaded from Google Cloud Console)", "description": "Google OAuth2 client credentials (downloaded from Google Cloud Console)"}, {"id": "productivity/taskflow-mcp", "label": "taskflow-mcp", "title": "TaskFlow MCP — Ferramentas e Workflows", "size": 4747, "category": "productivity", "summary": "Interact with the TaskFlow MCP server via Hermes Agent for GTD task management with SSE...", "description": "Interact with the TaskFlow MCP server via Hermes Agent for GTD task management with SSE transport and 2-step confirmation.\\n\\nLoad this skill when managing tasks through the TaskFlow MCP system. Covers SSE transport setup, full tool catalog (list/get/create/update/delete tasks and next actions), 2-step confirmation flow for writes, context UUID requirements, NLP quick-add workflows, and GTD pipeline i : "software-development/spike", "target": "software-development/plan", "type": "uses"}, {"source": "software-development/systematic-debugging", "target": "software-development/plan", "type": "uses"}, {"source": "software-development/plan", "target": "software-development/spike", "type": "similar"}, {"source": "software-development/skill-curation", "target": "software-development/skills-repo-curator", "type": "similar"}, {"source": "software-development/skill-curation", "target": "read-reddit", "type": "uses"}, {"source": "software-development/skill-curation", "target": "research/tech-trend-discovery", "type": "uses"}, {"source": "software-development/skills-repo-curator", "target": "productivity/relatorio-de-custos", "type": "uses"}, {"source": "software-development/skills-repo-curator", "target": "software-development/plan", "type": "uses"}, {"source": "software-development/spike", "target": "software-development/systematic-debugging", "type": "similar"}, {"source": "software-development/spike", "target": "software-development/ideation-drilling", "type": "uses"}, {"source": "software-development/spike", "target": "software-development/test-driven-development", "type": "uses"}, {"source": "software-development/systematic-debugging", "target": "software-development/test-driven-development", "type": "uses"}, {"source": "software-development/systematic-debugging", "target": "software-development/spike", "type": "uses"}, {"source": "software-development/test-driven-development", "target": "software-development/systematic-debugging", "type": "similar"}, {"source": "dogfood", "target": "github/codebase-inspection", "type": "similar"}, {"source": "dogfood", "target": "github/github-issues", "type": "uses"}, {"source": "dogfood", "target": "github/github-pr-workflow", "type": "similar"}, {"source": "dogfood", "target": "software-development/systematic-debugging", "type": "similar"}, {"source": "read-reddit", "target": "research/tech-trend-discovery", "type": "similar"}]};

const CAT_COLORS = {
  'apple':'#ff6b6b','autonomous-ai-agents':'#845ef7','content-production':'#f06595',
  'creative':'#ffd43b','data-science':'#20c997','dogfood':'#ff922b','email':'#74c0fc',
  'github':'#adb5bd','infrastructure':'#4dabf7','media':'#da77f2',
  'messaging-platforms':'#63e6be','mlops':'#f783ac','note-taking':'#a9e34b',
  'productivity':'#228be6','read-reddit':'#ff8787','research':'#38d9a9',
  'social-media':'#e599f7','software-development':'#339af0','yuanbao':'#ffa94d',
  'uncategorized':'#868e96'
};

const width = window.innerWidth, height = window.innerHeight;
const svg = d3.select("#graph").append("svg").attr("width",width).attr("height",height).attr("viewBox",[0,0,width,height]);
const g = svg.append("g");
const zoom = d3.zoom().scaleExtent([0.2,4]).on("zoom",(e)=>g.attr("transform",e.transform));
svg.call(zoom);

svg.append("defs").append("marker").attr("id","arrow").attr("viewBox","0 -5 10 10")
  .attr("refX",24).attr("refY",0).attr("markerWidth",6).attr("markerHeight",6).attr("orient","auto")
  .append("path").attr("d","M0,-5L10,0L0,5").attr("fill","#6080ff");

const nodes = DATA.nodes.map(d=>({...d}));
const links = DATA.edges.map(d=>({...d}));
const sizeScale = d3.scaleSqrt().domain([0,d3.max(nodes,d=>d.size)]).range([4,22]);

const simulation = d3.forceSimulation(nodes)
  .force("link",d3.forceLink(links).id(d=>d.id).distance(90))
  .force("charge",d3.forceManyBody().strength(-180))
  .force("center",d3.forceCenter(width/2,height/2))
  .force("collision",d3.forceCollide().radius(d=>sizeScale(d.size)+4));

const link = g.append("g").selectAll("g").data(links).join("g");
link.filter(d=>d.type==="similar").append("line")
  .attr("stroke","#8080a0").attr("stroke-width",1).attr("stroke-dasharray","4,4").attr("opacity",0.5);
link.filter(d=>d.type==="uses").append("line")
  .attr("stroke","#6080ff").attr("stroke-width",1.5).attr("marker-end","url(#arrow)").attr("opacity",0.6);

const node = g.append("g").selectAll("g").data(nodes).join("g").attr("cursor","pointer")
  .call(d3.drag()
    .on("start",(e,d)=>{if(!e.active)simulation.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y;})
    .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y;})
    .on("end",(e,d)=>{if(!e.active)simulation.alphaTarget(0);d.fx=null;d.fy=null;}));

node.append("circle").attr("r",d=>sizeScale(d.size))
  .attr("fill",d=>CAT_COLORS[d.category]||"#868e96")
  .attr("stroke","#0a0a14").attr("stroke-width",1.5);

node.append("text").text(d=>d.label).attr("x",14).attr("y",3)
  .attr("font-size","9px").attr("fill","#9090c0").attr("opacity",0.7);

// Hover: highlight
node.on("mouseenter", function(e,d) {
    d3.select(this).select("circle").transition().duration(200).attr("stroke","#fff").attr("stroke-width",2.5);
    d3.select(this).select("text").transition().duration(200).attr("opacity",1).attr("font-size","11px").attr("fill","#fff");
    link.selectAll("line").attr("opacity",l=>(l.source.id===d.id||l.target.id===d.id)?1:0.1);
    node.selectAll("circle").attr("opacity",n=>{
      if(n.id===d.id)return 1;
      return links.some(l=>(l.source.id===d.id&&l.target.id===n.id)||(l.target.id===d.id&&l.source.id===n.id))?0.9:0.15;
    });
  })
  .on("mouseleave", function() {
    d3.select(this).select("circle").transition().duration(200).attr("stroke","#0a0a14").attr("stroke-width",1.5);
    d3.select(this).select("text").transition().duration(200).attr("opacity",0.7).attr("font-size","9px").attr("fill","#9090c0");
    link.selectAll("line").attr("opacity",d=>d.type==="similar"?0.5:0.6);
    node.selectAll("circle").attr("opacity",1);
  });

// Click: open modal
node.on("click", function(e,d) { openModal(d); });
node.on("touchstart", function(e,d) { e.preventDefault(); openModal(d); });

// Modal functions
function openModal(d) {
  const catColor = CAT_COLORS[d.category] || "#868e96";
  document.getElementById("modal-cat-badge").textContent = d.category;
  document.getElementById("modal-cat-badge").style.background = catColor + "30";
  document.getElementById("modal-cat-badge").style.color = catColor;
  document.getElementById("modal-size").textContent = (d.size/1024).toFixed(1) + " KB";
  document.getElementById("modal-title").textContent = d.label;
  
  // Summary
  const summary = d.summary || "";
  document.getElementById("modal-summary").textContent = summary;
  document.getElementById("modal-summary-section").style.display = summary ? "block" : "none";
  
  // Full description
  const desc = d.description || "";
  document.getElementById("modal-desc").textContent = desc;
  document.getElementById("modal-desc-section").style.display = desc ? "block" : "none";
  
  // Relations
  const rels = DATA.edges.filter(e => e.source.id === d.id || e.target.id === d.id);
  const relsHtml = rels.map(e => {
    const isSource = e.source.id === d.id;
    const other = isSource ? e.target.label : e.source.label;
    const type = isSource ? e.type : (e.type === 'uses' ? 'used_by' : 'similar');
    let typeClass = 'rel-' + type;
    return `<div class="modal-rel"><span class="modal-rel-type ${typeClass}">${type}</span> ${other}</div>`;
  }).join('');
  document.getElementById("modal-relations").innerHTML = relsHtml || '<div style="font-size:11px;color:#505070">No relations</div>';
  
  document.getElementById("modal-backdrop").classList.add("open");
}

function closeModal(e) {
  if (e && e.target !== document.getElementById("modal-backdrop")) return;
  document.getElementById("modal-backdrop").classList.remove("open");
}

// Keyboard close
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

simulation.on("tick",()=>{
  link.filter(d=>d.type==="similar").select("line").attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  link.filter(d=>d.type==="uses").select("line").attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  node.attr("transform",d=>`translate(${d.x},${d.y})`);
});

function filterNodes(){
  const q = d3.select("#search").property("value").toLowerCase();
  if(!q){node.selectAll("circle").attr("opacity",1);node.selectAll("text").attr("opacity",0.7);link.selectAll("line").attr("opacity",d=>d.type==="similar"?0.5:0.6);return;}
  node.selectAll("circle").attr("opacity",d=>(d.label.toLowerCase().includes(q)||d.category.toLowerCase().includes(q)||d.title.toLowerCase().includes(q))?1:0.08);
  node.selectAll("text").attr("opacity",d=>(d.label.toLowerCase().includes(q)||d.category.toLowerCase().includes(q)||d.title.toLowerCase().includes(q))?0.9:0);
  link.selectAll("line").attr("opacity",d=>{
    const s=d.source.label.toLowerCase().includes(q)||d.source.category.toLowerCase().includes(q);
    const t=d.target.label.toLowerCase().includes(q)||d.target.category.toLowerCase().includes(q);
    return(s||t)?(d.type==="similar"?0.5:0.6):0.03;
  });
}

function resetZoom(){svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity);}
d3.select("#stats").html(`${DATA.nodes.length} skills · ${DATA.edges.length} connections`);

window.addEventListener('resize',()=>{
  const w=window.innerWidth,h=window.innerHeight;
  svg.attr("width",w).attr("height",h).attr("viewBox",[0,0,w,h]);
  simulation.force("center",d3.forceCenter(w/2,h/2)).alpha(0.3).restart();
});
</script>
