(function(){

const w=window.innerWidth,h=window.innerHeight;
const svg=d3.select("#graph").append("svg").attr("width",w).attr("height",h).attr("viewBox",[0,0,w,h]);
const g=svg.append("g");
const zoom=d3.zoom().scaleExtent([.2,4]).on("zoom",e=>g.attr("transform",e.transform));
svg.call(zoom);
svg.append("defs").append("marker").attr("id","arrow").attr("viewBox","0 -5 10 10").attr("refX",24).attr("refY",0).attr("markerWidth",6).attr("markerHeight",6).attr("orient","auto").append("path").attr("d","M0,-5L10,0L0,5").attr("fill","#6080ff");
const nodes=DATA.nodes.map(d=>({...d}));
const links=DATA.edges.map(d=>({...d}));
const sizeScale=d3.scaleSqrt().domain([0,d3.max(nodes,d=>d.size)]).range([4,22]);
const sim=d3.forceSimulation(nodes).force("link",d3.forceLink(links).id(d=>d.id).distance(90)).force("charge",d3.forceManyBody().strength(-180)).force("center",d3.forceCenter(w/2,h/2)).force("collision",d3.forceCollide().radius(d=>sizeScale(d.size)+4));

function openModal(d){const c=CAT_COLORS[d.category]||"#868e96";document.getElementById("modal-cat-badge").textContent=d.category;document.getElementById("modal-cat-badge").style.background=c+"30";document.getElementById("modal-cat-badge").style.color=c;document.getElementById("modal-size").textContent=(d.size/1024).toFixed(1)+" KB";document.getElementById("modal-title").textContent=d.label;const s=d.summary||"";document.getElementById("modal-summary").textContent=s;document.getElementById("modal-summary-section").style.display=s?"block":"none";const desc=d.description||"";document.getElementById("modal-desc").textContent=desc;document.getElementById("modal-desc-section").style.display=desc?"block":"none";const rels=DATA.edges.filter(e=>e.source.id===d.id||e.target.id===d.id);document.getElementById("modal-relations").innerHTML=rels.map(e=>{const is=e.source.id===d.id,other=is?e.target.label:e.source.label,type=is?e.type:(e.type==='uses'?'used_by':'similar'),cls='rel-'+type;return'<div class="modal-rel"><span class="modal-rel-type '+cls+'">'+type+'</span> '+other+'</div>'}).join('')||'<div style="font-size:11px;color:#505070">No relations</div>';document.getElementById("modal-backdrop").classList.add("open")}
function closeModal(e){if(e&&e.target!==document.getElementById("modal-backdrop"))return;document.getElementById("modal-backdrop").classList.remove("open")}

function filterNodes(){const q=d3.select("#search").property("value").toLowerCase();if(!q){node.selectAll("circle").attr("opacity",1);node.selectAll("text").attr("opacity",.7);link.selectAll("line").attr("opacity",d=>d.type==="similar"?.5:.6);return}node.selectAll("circle").attr("opacity",d=>(d.label.toLowerCase().includes(q)||d.category.toLowerCase().includes(q))?1:.08);node.selectAll("text").attr("opacity",d=>(d.label.toLowerCase().includes(q)||d.category.toLowerCase().includes(q))?.9:0);link.selectAll("line").attr("opacity",d=>{const s=d.source.label.toLowerCase().includes(q)||d.source.category.toLowerCase().includes(q),t=d.target.label.toLowerCase().includes(q)||d.target.category.toLowerCase().includes(q);return(s||t)?(d.type==="similar"?.5:.6):.03})}
