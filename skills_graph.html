const DATA = {"nodes": [{"id": "analise-contratual", "label": "analise-contratual", "category": "business", "type": "Reference", "size": 5159, "summary": "Use ao analisar contratos/minutas — subcontratação, LGPD.", "description": "Use ao analisar contratos/minutas — subcontratação, LGPD.\n\nCarregue esta skill quando precisar analisar minuta de contrato, contrato, edital, plano de trabalho ou proposta — especialmente quando a ID Consultoria (ou um cliente) é subcontratada/fornecedora. Cobre checklist de riscos (subcontratação, pay-when-paid, LGPD, propriedade intelectual, SLA/multas), cruzamento contrato × plano de trabalho para achar divergências de escopo/valor/prazo, e identificação de partes e regime jurídico (Lei 14.133/2021, LGPD 13.709/2018). Usa google-workspace para localizar documentos no Drive e scripts/pdf2txt.py para extrair texto de PDFs. Entrega resumo executivo no chat + arquivo .md completo via MEDIA."}, {"id": "auxiliar-adm-id", "label": "auxiliar-adm-id", "category": "business", "type": "Orchestrator", "size": 12361, "summary": "Auxiliar admin da ID: contratos, planilhas, NFS-e, Drive.", "description": "Auxiliar admin da ID: contratos, planilhas, NFS-e, Drive."}, {"id": "elaboracao-proposta-comercial", "label": "elaboracao-proposta-comercial", "category": "business", "type": "Orchestrator", "size": 10581, "summary": "ID Consultoria commercial proposals — client context to branded HTML + minuta.", "description": "ID Consultoria commercial proposals — client context to branded HTML + minuta.\n\nLoad this skill when creating a commercial proposal from client context (documents, negotiation messages, meeting minutes). Builds the branded HTML proposal by editing the brand template directly, and produces a Google Docs contract minuta in the Minutas subfolder, preserving first/last pages. Validates content incrementally with the user following the Guia de Princípios."}, {"id": "emissao-nfse", "label": "emissao-nfse", "category": "business", "type": "ToolIntegration", "size": 4668, "summary": "Emitir NFS-e/NF-e da ID via motor nfelib (NFS-e Nacional).", "description": "Emitir NFS-e/NF-e da ID via motor nfelib (NFS-e Nacional)."}, {"id": "gestao-financeira-id", "label": "gestao-financeira-id", "category": "business", "type": "Reference", "size": 5611, "summary": "Operar planilhas/Google da ID e fazer backfill de extrato.", "description": "Operar planilhas/Google da ID e fazer backfill de extrato."}, {"id": "inter-api-id-consultoria", "label": "inter-api-id-consultoria", "category": "business", "type": "ToolIntegration", "size": 5617, "summary": "Consultar extrato/saldo da conta Inter da ID.", "description": "Consultar extrato/saldo da conta Inter da ID."}, {"id": "planejamento-estrategico-2h", "label": "planejamento-estrategico-2h", "category": "business", "type": "Orchestrator", "size": 11225, "summary": "Facilitar planejamento estratégico em 2h — EOS V/TO + One-Page Strategic Plan.", "description": "Facilitar planejamento estratégico em 2h — EOS V/TO + One-Page Strategic Plan.\n\nCarregue esta skill quando precisar facilitar uma sessão única de planejamento estratégico para dono de PME + time pequeno (3-12 pessoas), com entregável obrigatório de 1 página. Usa EOS V/TO (Wickman) + One-Page Strategic Plan (Harnish), técnicas Liberating Structures, pré-mortem e timeboxing rigoroso. BSC e Hoshin Kanri não fecham em 2h — servem só como lente conceitual. Absorveu planejamento-estrategico (merge 16/08/2026): tabela de adequação de 11 frameworks + catálogo."}, {"id": "proposta-comercial-consultoria", "label": "proposta-comercial-consultoria", "category": "business", "type": "Orchestrator", "size": 5501, "summary": "Proposta comercial de consultoria — princípios, pricing e modelo HTML da marca ID.", "description": "Proposta comercial de consultoria — princípios, pricing e modelo HTML da marca ID.\n\nCarregue esta skill quando precisar criar, ajustar ou precificar uma proposta comercial de consultoria (ID Consultoria ou genérica). Validada em 14/08/2026 com 40+ fontes (HBR, VeraSage, RAIN Group, McKinsey/BCG/Bain). Cobre o Guia de Princípios, precificação, o modelo HTML com marca da ID e iterações slide a slide do modelo."}, {"id": "valuation-consultivo", "label": "valuation-consultivo", "category": "business", "type": "Orchestrator", "size": 12593, "summary": "Valuation consultivo de startup early-stage — rNPV, âncoras de persuasão, planilha.", "description": "Valuation consultivo de startup early-stage — rNPV, âncoras de persuasão, planilha.\n\nCarregue esta skill quando conduzir valuation de empresa early-stage para investidores, do diálogo à planilha .xlsx pronta e narrativa persuasiva. Metodologia rNPV + 3 âncoras (deals comparáveis, rodadas, reverse DCF) + triangulação + cap table honesta. Não é biotech-only — serve para health, deeptech, SaaS e industrial."}, {"id": "augmentacao-query", "label": "augmentacao-query", "category": "research", "type": "Research", "size": 4590, "summary": "Busca semântica nas 97 soluções de Aumentação de Processos com IA via Vulcano MCP.", "description": "Busca semântica nas 97 soluções de Aumentação de Processos com IA via Vulcano MCP.\n\nCarregue esta skill quando precisar buscar soluções de aumento de processos — consulta semântica via Vulcano MCP sobre as 97 soluções catalogadas.\n\nUse esta skill quando quiser encontrar soluções relevantes por significado, ler documentos completos, ou navegar por setor."}, {"id": "augmentation-process-design", "label": "augmentation-process-design", "category": "research", "type": "Research", "size": 9639, "summary": "Design, research and curadoria de soluções de augmentação de processos com IA", "description": "Design, research and curadoria de soluções de augmentação de processos com IA\n\nLoad this skill when the user wants to research, catalog or design solutions that augment (not automate) human work with AI. Covers the granular solution concept, the A/B × I/II/III taxonomy, the PME-friendly bias, the operational analytics niche, and the delivery format (index + solucoes/ folder with YAML frontmatter)."}, {"id": "competitor-news-monitor", "label": "competitor-news-monitor", "category": "research", "type": "Research", "size": 4752, "summary": "Watch named companies for material news; cited digests.", "description": "Watch named companies for material news; cited digests.\n\nLoad this skill when you need to monitor named companies for material news — sources, deduplication, and cited digests delivered on a schedule. Complements market-research-synthesis and deep-research."}, {"id": "deep-research", "label": "deep-research", "category": "research", "type": "Research", "size": 25738, "summary": "Multi-agent deep research: decompose, dispatch agents, cross-validate, synthesize.", "description": "Multi-agent deep research: decompose, dispatch agents, cross-validate, synthesize.\n\nLoad this skill when you need thorough research on complex topics. Inspired by GPT-Researcher, this pipeline decomposes questions into sub-queries, dispatches parallel research agents across web, GitHub, news, and academic sources, runs independent reviewers, then cross-validates and synthesizes. Produces cited reports with confidence-graded findings across three depth levels."}, {"id": "grounded-citations", "label": "grounded-citations", "category": "research", "type": "ToolIntegration", "size": 11937, "summary": "Ground answers and documents in cited, verifiable sources.", "description": "Ground answers and documents in cited, verifiable sources.\n\nLoad this skill whenever an answer or artifact rests on information you fetched rather than knew — research, comparisons, news summaries, reports, briefs, docs, decks, or any multi-source synthesis where the user will want to check your work. Uses a ledger script (scripts/sources.py, stdlib-only) that owns the url → [n] mapping so citation numbers come from retrieval, never memory; cite-while-drafting with inline [n] ids, mechanically rendered Sources blocks, and a verify step that fails drafts with unknown ids or thin coverage. Fact-checking mode attaches verbatim quotes per source and flags model-knowledge claims [unverified]."}, {"id": "market-research-synthesis", "label": "market-research-synthesis", "category": "research", "type": "Research", "size": 19103, "summary": "Produce market analysis reports — personas, journeys, expectations, behavior.", "description": "Produce market analysis reports — personas, journeys, expectations, behavior.\n\nLoad this skill when conducting market research for Brazilian/LATAM markets where web research tools face comprehensive blocking. Produces structured reports covering buyer personas, customer journeys, expectations hierarchies, purchasing behavior, and retention/fidelization. Pivots to domain-knowledge synthesis with transparent caveats when web tools fail."}, {"id": "systematic-research", "label": "systematic-research", "category": "research", "type": "Research", "size": 26836, "summary": "Single-agent deep research via direct source URLs.", "description": "Single-agent deep research via direct source URLs.\n\nLoad this skill when web_search is consistently unavailable (returns empty arrays for ALL queries after 2+ attempts) and you need thorough research without multi-agent dispatch. Uses domain knowledge to identify authoritative source URLs, batch parallel web_extract calls, handle blocked/404 pages, and page through large truncated encyclopedia-style articles. Produces cited, structured reports with source attribution. Complementary to deep-research (which covers multi-agent dispatch)."}, {"id": "user-interview", "label": "user-interview", "category": "research", "type": "Research", "size": 9558, "summary": "Structured user/proxy interview protocol for product research — plan, frame", "description": "Structured user/proxy interview protocol for product research — plan, frame\n\nLoad this skill during the Research phase of the product pipeline to understand user needs. Covers interview planning, question framing, active listening techniques, synthesis of findings, and persona extraction. Can interview real humans or simulate interviews with AI agent profiles."}, {"id": "document-to-action-items", "label": "document-to-action-items", "category": "productivity", "type": "Orchestrator", "size": 4231, "summary": "Extract cited obligations, deadlines, tasks from documents.", "description": "Extract cited obligations, deadlines, tasks from documents.\n\nLoad this skill when you need to extract obligations, deadlines and tasks from a document (contract, report, brief) — with citations back to the source, owners, and due dates. Works with pdf/docx/notion inputs."}, {"id": "docx", "label": "docx", "category": "productivity", "type": "ToolIntegration", "size": 8637, "summary": "Create, read, edit Word .docx documents and templates.", "description": "Create, read, edit Word .docx documents and templates.\n\nLoad this skill whenever the user wants to create, read, edit, or manipulate Word documents (.docx) or Word templates (.dotx) — reports, memos, letters, letterheads, tables of contents, tracked changes, and comments. Covers both the high-level creation path (docx-js npm) and surgical XML editing, plus pandoc/LibreOffice for reading and rendering. Do NOT use for PDFs, spreadsheets, or presentations."}, {"id": "google-docs-formatting", "label": "google-docs-formatting", "category": "productivity", "type": "ToolIntegration", "size": 7564, "summary": "Format Google Docs/Sheets via REST API (markdown, chips).", "description": "Format Google Docs/Sheets via REST API (markdown, chips).\n\nLoad this skill when you need to format Google Docs or Sheets through the REST API — markdown conversion (md-to-gdoc), chips and checkboxes, tables, and mermaid rendering to images. Complements google-workspace with pixel-level fidelity notes."}, {"id": "google-sheets-automation", "label": "google-sheets-automation", "category": "productivity", "type": "ToolIntegration", "size": 8856, "summary": "Polish Google Sheets via API (dropdowns, formulas, KPIs).", "description": "Polish Google Sheets via API (dropdowns, formulas, KPIs).\n\nLoad this skill when you need to polish Google Sheets via API — data validation dropdowns, formulas, KPI sheets, and UX best practices. Complements google-workspace and xlsx. Absorveu google-sheets-formatting (merge 16/08/2026): pitfalls de formatação batchUpdate + convenções de cor financeiro."}, {"id": "google-workspace", "label": "google-workspace", "category": "productivity", "type": "ToolIntegration", "size": 24914, "summary": "Gmail, Calendar, Drive, Docs, Sheets via gws CLI — OAuth2 setup and automation.", "description": "Gmail, Calendar, Drive, Docs, Sheets via gws CLI — OAuth2 setup and automation.\n\nLoad this skill when you need to automate Google Workspace. Covers gws CLI installation and OAuth2 setup from Google Cloud Console credentials, then using it for Gmail operations, Calendar management, Drive file operations, Docs editing, and Sheets data manipulation."}, {"id": "html-pdf-fidelity", "label": "html-pdf-fidelity", "category": "productivity", "type": "Orchestrator", "size": 9298, "summary": "HTML→PDF identical to the browser — fonts, layout, 1 page.", "description": "HTML→PDF identical to the browser — fonts, layout, 1 page.\n\nLoad this skill when a PDF export differs from the browser rendering (fonts, layout, pagination) or the user demands fidelidade máxima HTML→PDF. Chromium headless print pipeline with exact font embedding and one-page control."}, {"id": "html-report-hermes", "label": "html-report-hermes", "category": "productivity", "type": "Template", "size": 15276, "summary": "Render research reports as dark-themed HTML with SVG charts and Tufte typography.", "description": "Render research reports as dark-themed HTML with SVG charts and Tufte typography.\n\nLoad this skill when producing structured visual output. Covers two design systems: Hermes CRT for visual showcases and Hermes Official for data reports. Includes CRT overlay mechanics, component library, report structure templates, Telegram delivery via ZIP, and agy pipeline for complex CRT pages."}, {"id": "html-to-pdf-chromium", "label": "html-to-pdf-chromium", "category": "productivity", "type": "Template", "size": 9869, "summary": "Convert HTML to PDF via Chromium headless — ARM64 fallback to WeasyPrint.", "description": "Convert HTML to PDF via Chromium headless — ARM64 fallback to WeasyPrint.\n\nLoad this skill when generating PDF from HTML with browser-quality rendering, or when weasyprint output lacks CSS features like -webkit-background-clip or gradients. Covers Chromium headless installation via Debian .deb extraction without root or Playwright, PDF generation with full CSS support, WeasyPrint for ARM64 systems, and common rendering fixes."}, {"id": "id-papel-timbrado", "label": "id-papel-timbrado", "category": "productivity", "type": "Reference", "size": 12267, "summary": "Use ao criar doc da ID com timbrado no Google Docs.", "description": "Use ao criar doc da ID com timbrado no Google Docs."}, {"id": "md-to-timbrado-id", "label": "md-to-timbrado-id", "category": "productivity", "type": "ToolIntegration", "size": 4902, "summary": "Gerar Google Doc no timbrado da ID a partir de Markdown.", "description": "Gerar Google Doc no timbrado da ID a partir de Markdown."}, {"id": "meeting-action-items", "label": "meeting-action-items", "category": "productivity", "type": "Orchestrator", "size": 4072, "summary": "Turn meeting notes into cited decisions, owners, tickets.", "description": "Turn meeting notes into cited decisions, owners, tickets.\n\nLoad this skill when you have meeting notes or transcripts and need to extract decisions, action items, owners and deadlines — with citations and optional ticket creation. Complements document-to-action-items."}, {"id": "notion", "label": "notion", "category": "productivity", "type": "ToolIntegration", "size": 15982, "summary": "Notion API plus ntn CLI — pages, databases, markdown import, Workers integration.", "description": "Notion API plus ntn CLI — pages, databases, markdown import, Workers integration.\n\nLoad this skill for Notion automation. Covers the Notion API for creating and updating pages and databases, the ntn CLI for markdown import/export, database query and filtering, and Cloudflare Workers integration for serverless Notion automations."}, {"id": "pdf", "label": "pdf", "category": "productivity", "type": "ToolIntegration", "size": 7498, "summary": "Create, merge, split, fill, and secure PDF files.", "description": "Create, merge, split, fill, and secure PDF files.\n\nLoad this skill whenever the user wants to do anything with PDF files: reading or extracting text/tables, combining or merging multiple PDFs, splitting PDFs apart, rotating pages, adding watermarks, creating new PDFs, filling PDF forms, encrypting/decrypting, extracting images, or OCR on scanned PDFs. Uses pypdf, pdfplumber, reportlab, poppler-utils, and qpdf. For heavy text extraction from scanned documents prefer ocr-and-documents."}, {"id": "pdf-to-html", "label": "pdf-to-html", "category": "productivity", "type": "ToolIntegration", "size": 11787, "summary": "PDF→HTML: Type3/Figma extraction gotchas + clean semantic rebuild.", "description": "PDF→HTML: Type3/Figma extraction gotchas + clean semantic rebuild.\n\nLoad this skill when replicating a PDF design as HTML (slide deck, proposal, one-pager) or extracting vector art/text for the web. Especially relevant for Figma-exported PDFs (Type3 fonts) — full of silent traps. Default for this user: clean semantic rebuild with foreground/background separated, not pixel-perfect SVG. Absorveu pdf-deck-to-html, pdf-slides-to-html, pdf-to-html-replication e branded-html-replication (merge 16/08/2026): estrutura de proposta comercial aprovada, extração de assets, pipeline completo."}, {"id": "relatorio-de-custos", "label": "relatorio-de-custos", "category": "product const CAT_COLORS={'apple':'#ff6b6b','autonomous-ai-agents':'#845ef7','content-production':'#f06595','creative':'#ffd43b','data-science':'#20c997','dogfood':'#ff922b','email':'#74c0fc','github':'#adb5bd','infrastructure':'#4dabf7','media':'#da77f2','messaging-platforms':'#63e6be','mlops':'#f783ac','note-taking':'#a9e34b','productivity':'#228be6','read-reddit':'#ff8787','research':'#38d9a9','social-media':'#e599f7','software-development':'#339af0','yuanbao':'#ffa94d','uncategorized':'#868e96'};
const w=window.innerWidth,h=window.innerHeight;
const svg=d3.select("#graph").append("svg").attr("width",w).attr("height",h).attr("viewBox",[0,0,w,h]);
const g=svg.append("g");
const zoom=d3.zoom().scaleExtent([.2,4]).on("zoom",e=>g.attr("transform",e.transform));
svg.call(zoom);
svg.append("defs").append("marker").attr("id","arrow").attr("viewBox","0 -5 10 10").attr("refX",24).attr("refY",0).attr("markerWidth",6).attr("markerHeight",6).attr("orient","auto").append("path").attr("d","M0,-5L10,0L0,5").attr("fill","#6080ff");
const nodes=DATA.nodes.map(d=>({...d}));
const links=DATA.edges.map(d=>({...d}));
const sizeScale=d3.scaleSqrt().domain([0,d3.max(nodes,d=>d.size)]).range([4,22]);
const sim=d3.forceSimulation(nodes).force("link",d3.forceLink(links).id(d=>d.id).distance(90)).force("charge",d3.forceManyBody().strength(-180)).force("center",d3.forceCenter(w/2,h/2)).force("collision",d3.forceCollide().radius(d=>sizeScale(d.size)+4));
const link=g.append("g").selectAll("g").data(links).join("g");
link.filter(d=>d.type==="similar").append("line").attr("stroke","#8080a0").attr("stroke-width",1).attr("stroke-dasharray","4,4").attr("opacity",.5);
link.filter(d=>d.type==="uses").append("line").attr("stroke","#6080ff").attr("stroke-width",1.5).attr("marker-end","url(#arrow)").attr("opacity",.6);
const node=g.append("g").selectAll("g").data(nodes).join("g").attr("cursor","pointer").call(d3.drag().on("start",(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y}).on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y}).on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));
node.append("circle").attr("r",d=>sizeScale(d.size)).attr("fill",d=>CAT_COLORS[d.category]||"#868e96").attr("stroke","#0a0a14").attr("stroke-width",1.5);
node.append("text").text(d=>d.label).attr("x",14).attr("y",3).attr("font-size","9px").attr("fill","#9090c0").attr("opacity",.7);
node.on("mouseenter",function(e,d){d3.select(this).select("circle").transition().duration(200).attr("stroke","#fff").attr("stroke-width",2.5);d3.select(this).select("text").transition().duration(200).attr("opacity",1).attr("font-size","11px").attr("fill","#fff");link.selectAll("line").attr("opacity",l=>(l.source.id===d.id||l.target.id===d.id)?1:.1);node.selectAll("circle").attr("opacity",n=>{if(n.id===d.id)return 1;return links.some(l=>(l.source.id===d.id&&l.target.id===n.id)||(l.target.id===d.id&&l.source.id===n.id))?.9:.15})}).on("mouseleave",function(){d3.select(this).select("circle").transition().duration(200).attr("stroke","#0a0a14").attr("stroke-width",1.5);d3.select(this).select("text").transition().duration(200).attr("opacity",.7).attr("font-size","9px").attr("fill","#9090c0");link.selectAll("line").attr("opacity",d=>d.type==="similar"?.5:.6);node.selectAll("circle").attr("opacity",1)});
node.on("click",function(e,d){openModal(d)});
function openModal(d){const c=CAT_COLORS[d.category]||"#868e96";document.getElementById("modal-cat-badge").textContent=d.category;document.getElementById("modal-cat-badge").style.background=c+"30";document.getElementById("modal-cat-badge").style.color=c;document.getElementById("modal-size").textContent=(d.size/1024).toFixed(1)+" KB";document.getElementById("modal-title").textContent=d.label;const s=d.summary||"";document.getElementById("modal-summary").textContent=s;document.getElementById("modal-summary-section").style.display=s?"block":"none";const desc=d.description||"";document.getElementById("modal-desc").textContent=desc;document.getElementById("modal-desc-section").style.display=desc?"block":"none";const rels=DATA.edges.filter(e=>e.source.id===d.id||e.target.id===d.id);document.getElementById("modal-relations").innerHTML=rels.map(e=>{const is=e.source.id===d.id,other=is?e.target.label:e.source.label,type=is?e.type:(e.type==='uses'?'used_by':'similar'),cls='rel-'+type;return'<div class="modal-rel"><span class="modal-rel-type '+cls+'">'+type+'</span> '+other+'</div>'}).join('')||'<div style="font-size:11px;color:#505070">No relations</div>';document.getElementById("modal-backdrop").classList.add("open")}
function closeModal(e){if(e&&e.target!==document.getElementById("modal-backdrop"))return;document.getElementById("modal-backdrop").classList.remove("open")}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
sim.on("tick",()=>{link.filter(d=>d.type==="similar").select("line").attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);link.filter(d=>d.type==="uses").select("line").attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);node.attr("transform",d=>"translate("+d.x+","+d.y+")")});
function filterNodes(){const q=d3.select("#search").property("value").toLowerCase();if(!q){node.selectAll("circle").attr("opacity",1);node.selectAll("text").attr("opacity",.7);link.selectAll("line").attr("opacity",d=>d.type==="similar"?.5:.6);return}node.selectAll("circle").attr("opacity",d=>(d.label.toLowerCase().includes(q)||d.category.toLowerCase().includes(q))?1:.08);node.selectAll("text").attr("opacity",d=>(d.label.toLowerCase().includes(q)||d.category.toLowerCase().includes(q))?.9:0);link.selectAll("line").attr("opacity",d=>{const s=d.source.label.toLowerCase().includes(q)||d.source.category.toLowerCase().includes(q),t=d.target.label.toLowerCase().includes(q)||d.target.category.toLowerCase().includes(q);return(s||t)?(d.type==="similar"?.5:.6):.03})}
function resetZoom(){svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity)}
d3.select("#stats").html(DATA.nodes.length+" skills · "+DATA.edges.length+" connections");
window.addEventListener('resize',()=>{const W=window.innerWidth,H=window.innerHeight;svg.attr("width",W).attr("height",H).attr("viewBox",[0,0,W,H]);sim.force("center",d3.forceCenter(W/2,H/2)).alpha(.3).restart()});
})();
</script>
